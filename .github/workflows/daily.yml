name: Daily Taiwan stock screener
run-name: stock-screener ${{ inputs.mode || 'daily' }} ${{ inputs.date || 'scheduled' }}

on:
  schedule:
    - cron: '7 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily / warm-up / isolated test (previous trading day on holidays)'
        type: choice
        options: [daily, bootstrap, test]
        default: daily
      date:
        description: 'Taiwan YYYY-MM-DD; tests use prior session on holidays and may use runtime financials'
        type: string
      send_line:
        description: 'Send the prepared report to LINE (default is preview only)'
        type: boolean
        default: false
      scheduler:
        description: 'Trigger source; Cloudflare automation also respects LINE_ENABLED'
        type: choice
        options: [manual, cloudflare]
        default: manual

permissions:
  contents: write
  actions: read

concurrency:
  group: stock-screener-state
  cancel-in-progress: false

jobs:
  run:
    if: (github.event_name != 'workflow_dispatch' || inputs.mode != 'test') && (github.event_name != 'schedule' || vars.SCHEDULER_PROVIDER != 'cloudflare')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore state
        shell: bash
        run: |
          mkdir -p data reports
          if git show-ref --verify --quiet refs/remotes/origin/screener-data; then
            git archive origin/screener-data | tar -x
          fi
      - name: Determine intended Taiwan date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
          EVENT: ${{ github.event_name }}
          CREATED: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          from datetime import datetime, timezone, timedelta, date, time
          value = os.environ.get('INPUT_DATE')
          if not value:
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['CREATED']}"
              req = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req, timeout=20) as r:
                  run = json.load(r)
              stamp = datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
              local = stamp.astimezone(timezone(timedelta(hours=8)))
              intended = local.date()
              if os.environ['EVENT'] == 'schedule' and local.time() < time(21, 7):
                  intended -= timedelta(days=1)
              value = intended.isoformat()
          date.fromisoformat(value)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('value='+value+'\n')
          PY
      - name: Skip immutable same-day delivery
        id: delivery
        env:
          TARGET_DATE: ${{ steps.date.outputs.value }}
          MODE: ${{ inputs.mode || 'daily' }}
        run: |
          if [ "$MODE" = bootstrap ]; then
            echo 'already_sent=false' >> "$GITHUB_OUTPUT"
          else
            SENT=$(PYTHONPATH=. python -B scripts/check-delivery.py --date "$TARGET_DATE")
            echo "already_sent=$SENT" >> "$GITHUB_OUTPUT"
            if [ "$SENT" = true ]; then
              echo "$TARGET_DATE: immutable SENT report verified; duplicate run skipped." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Collect and screen (or manual bootstrap)
        if: steps.delivery.outputs.already_sent != 'true'
        id: analysis
        env:
          MODE: ${{ inputs.mode || 'daily' }}
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: |
          if [ "$MODE" = bootstrap ]; then
            python -B -m tstocknews bootstrap --days 220 --end "$TARGET_DATE"
          else
            python -B -m tstocknews daily --date "$TARGET_DATE" --require-report
            python - <<'PY'
          import json, os
          from pathlib import Path
          status = json.loads(Path('data/status.json').read_text())
          ready = status.get('status') == 'REPORT_READY' and status.get('date') == os.environ['TARGET_DATE']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('report_ready='+str(ready).lower()+'\n')
          PY
            if [ -f "reports/$TARGET_DATE.md" ] && [ "$(python -c 'import json; print(json.load(open("data/status.json"))["status"])')" = REPORT_READY ]; then
              python -B -m tstocknews prepare-send --date "$TARGET_DATE"
            fi
          fi
      - name: Persist prepared report and retry key before sending
        if: always() && steps.delivery.outcome == 'success' && steps.delivery.outputs.already_sent != 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/screener-data; then
            git worktree add --detach state-checkout origin/screener-data
          else
            git worktree add --detach state-checkout HEAD
            git -C state-checkout switch --orphan screener-data
          fi
          cp -a data reports state-checkout/
          git -C state-checkout add data reports
          if ! git -C state-checkout diff --cached --quiet; then
            git -C state-checkout -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Save daily screener state'
            git -C state-checkout push origin HEAD:refs/heads/screener-data
          fi
      - name: LINE push
        if: success() && steps.analysis.outputs.report_ready == 'true' && ((inputs.send_line == true && (inputs.scheduler != 'cloudflare' || vars.LINE_ENABLED == 'true')) || (github.event_name == 'schedule' && vars.LINE_ENABLED == 'true'))
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          TARGET_DATE: ${{ steps.date.outputs.value }}
        run: python -B -m tstocknews send --date "$TARGET_DATE" --require-sent
      - name: Save delivery result
        if: always()
        shell: bash
        run: |
          if [ -d state-checkout/.git ] || [ -f state-checkout/.git ]; then
            cp -a data reports state-checkout/
            git -C state-checkout add data reports
            if ! git -C state-checkout diff --cached --quiet; then
              git -C state-checkout -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Save delivery status'
              git -C state-checkout push origin HEAD:refs/heads/screener-data
            fi
          fi
      - name: Run summary
        if: always()
        shell: bash
        run: |
          if [ -f data/status.json ]; then cat data/status.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f data/error.json ]; then cat data/error.json >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screener-report-${{ github.run_id }}
          overwrite: true
          path: |
            reports/
            data/status.json
            data/error.json
          retention-days: 7

  test:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TEST_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Restore read-only production inputs and isolated test retries
        shell: bash
        run: |
          mkdir -p preview-source test-runs
          if git show-ref --verify --quiet refs/remotes/origin/screener-data; then
            git archive origin/screener-data data | tar -x -C preview-source
          fi
          if git show-ref --verify --quiet refs/remotes/origin/screener-tests; then
            git archive origin/screener-tests test-runs | tar -x
          fi
      - name: Generate isolated report
        id: preview
        env:
          INPUT_DATE: ${{ inputs.date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$INPUT_DATE" ]; then
            CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')
            INPUT_DATE=$(python -c 'import sys; from datetime import datetime,timezone,timedelta; print(datetime.fromisoformat(sys.argv[1].replace("Z","+00:00")).astimezone(timezone(timedelta(hours=8))).date())' "$CREATED")
          fi
          python -B -m tstocknews --data-dir preview-source/data test-report --date "$INPUT_DATE" --run-id "$TEST_ID"
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path('test-runs') / os.environ['TEST_ID'] / 'manifest.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('target='+manifest['target_date']+'\n')
          PY
      - name: Prepare isolated delivery
        env:
          TARGET_DATE: ${{ steps.preview.outputs.target }}
        run: python -B -m tstocknews --data-dir "test-runs/$TEST_ID/data" --report-dir "test-runs/$TEST_ID/reports" prepare-send --date "$TARGET_DATE"
      - name: Persist test report and retry key before LINE push
        run: bash scripts/persist-tests.sh
      - name: LINE test push
        if: inputs.send_line == true
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          TARGET_DATE: ${{ steps.preview.outputs.target }}
        run: python -B -m tstocknews --data-dir "test-runs/$TEST_ID/data" --report-dir "test-runs/$TEST_ID/reports" send --date "$TARGET_DATE" --require-sent
      - name: Persist test delivery result
        if: always() && steps.preview.outcome == 'success'
        run: bash scripts/persist-tests.sh
      - name: Test summary
        if: always()
        run: |
          if [ -f "test-runs/$TEST_ID/manifest.json" ]; then cat "test-runs/$TEST_ID/manifest.json" >> "$GITHUB_STEP_SUMMARY"; fi
          for path in test-runs/"$TEST_ID"/data/delivery/*.json; do
            if [ -f "$path" ]; then cat "$path" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-test-${{ github.run_id }}
          overwrite: true
          path: test-runs/${{ github.run_id }}/
          retention-days: 7
